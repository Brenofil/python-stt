[project]
name = "python-stt"
version = "0.1.0"
description = "Speech-to-text command line application"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Breno Filgueiras", email = "breno.fil.costa@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    # faster-whisper 1.2.x passes `metadata_errors` to av.open(), which av 19 removed.
    # 18.1.0 is yanked (memory corruption), so require 18.1.1+.
    "av>=18.1.1,<19",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
# Whisper on PyTorch (e.g. AMD GPUs via ROCm). PyTorch itself is installed separately, because
# the right build depends on the hardware (see Dockerfile / README).
gpu = ["transformers>=4.56"]

[project.scripts]
stt = "python_stt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_stt"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
