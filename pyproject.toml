[project]
name = "python-stt"
version = "0.1.0"
description = "Speech-to-text command line application"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Breno Filgueiras", email = "breno.fil.costa@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
stt = "python_stt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_stt"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
